<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rahul Prasad — designer portfolio" />
    <title>Rahul Prasad</title>
    <link rel="icon" type="image/jpg" href="/favicon.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', () => {

        const savedReferrer = sessionStorage.getItem('original_page_a');

        if (savedReferrer && window.va) {

          window.va('event', { 
            name: 'referrer_capture', 
            data: { from_page_a: savedReferrer } 
          });
          sessionStorage.removeItem('original_page_a');
        }
      });
    </script>
  </body>
</html>
